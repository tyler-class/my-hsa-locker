<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181818" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="HSA Locker" />
    <meta name="description" content="Every medical receipt for your HSA, in one place." />
    <title>HSA Locker</title>
    <script>
      // Apply the saved Light/Dark choice before first paint (see src/client/lib/theme.ts).
      try {
        var t = localStorage.getItem('hsa-locker-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t;
          var c = t === 'dark' ? '#181818' : '#f6f5f0';
          document.querySelectorAll('meta[name=theme-color]').forEach(function (m) {
            m.setAttribute('content', c);
          });
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
